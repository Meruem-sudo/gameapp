name: Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: last-line-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Pubblica l'APK come release "test-build": si scarica direttamente dal telefono
      - name: Publish test APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk last-line.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build last-line.apk --prerelease --target "${{ github.sha }}" \
            --title "Last Line - versione di prova" \
            --notes "APK di debug da installare direttamente sul telefono Android. Commit ${{ github.sha }}"

      # Release AAB firmato per il Play Store: parte solo se i secret sono configurati
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build release AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: last-line-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
